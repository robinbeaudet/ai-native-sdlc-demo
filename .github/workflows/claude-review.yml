name: Claude review

# Claude reviews every pull request (drafts included) directly in GitHub, using the
# checklist in REVIEW.md: inline comments on the lines concerned, plus a summary.
# Runs on your Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret.
# The review comments; it never approves or blocks: a human code owner does.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fixes pushed by the @claude workflow (claude.yml) arrive as github-actions[bot].
          # Without this, the action refuses to review them ("non-human actor").
          allowed_bots: "github-actions"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request: `git diff origin/${{ github.base_ref }}...HEAD`.
            Apply every check in REVIEW.md; the project rules are in CLAUDE.md.

            1. Post each finding as an inline comment on the line concerned, starting with
               "Important:" or "Nit:".
            2. Then post one summary comment with `gh pr comment`: the findings in a short
               table, ending with "VERDICT: APPROVE" or "VERDICT: REQUEST_CHANGES"
               (REQUEST_CHANGES if there is any Important finding).
          claude_args: >-
            --model sonnet --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *),Bash(git diff *),Bash(git log *)"
