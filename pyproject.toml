[project]
name = "expense-flow-api"
version = "0.1.0"
description = "Asynchronous corporate expense submission and approval platform (AI-Native SDLC reference implementation)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "expense_flow"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ANN",   # flake8-annotations (strict typing)
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez (no naive datetimes)
    "PL",    # pylint
    "FBT",   # flake8-boolean-trap
    "ERA",   # eradicate (commented-out code)
]
ignore = [
    "PLR0913", # FastAPI endpoints legitimately take many injected params
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "FBT"]
"scripts/**/*.py" = ["S603", "S607"] # the orchestrator's job is to run git, uv and claude

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "unit: pure, fast tests with no I/O",
    "integration: tests exercising the HTTP API and database",
    "eval: behavioural / financial-precision evaluations",
]
filterwarnings = ["error"]
